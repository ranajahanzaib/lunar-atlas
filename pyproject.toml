[project]
name = "lunar-atlas"
version = "1.0.0"
description = "Scientific data processing and ingestion pipelines for Lunar Atlas planetary geochemical observatory"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Rana Jahanzaib" }]
dependencies = [
    "numpy>=2.5.5",
    "pillow>=13.0.0",
    "polars>=2.1.0",
    "pyarrow>=26.0.1",
    "pydantic>=2.14.4",
    "pytest>=9.2.0",
    "scipy>=1.18.1",
]
